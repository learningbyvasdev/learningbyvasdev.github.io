        <h2>Class 10th - Chapter 1: The Happy Prince</h2>
        
        <h3>Short Answer Type Questions</h3>
        
        <div class="qa-block">
          <p><strong>1. Where did the statue of the Happy Prince stand?</strong></p>
          <p class="punjabi-txt">ਹੈਪੀ ਪ੍ਰਿੰਸ ਦਾ ਬੁੱਤ ਕਿੱਥੇ ਖੜ੍ਹਾ ਸੀ?</p>

          <p class="punjabi-txt">ਹੈਪੀ ਪ੍ਰਿੰਸ ਦਾ ਬੁੱਤ ਸ਼ਹਿਰ ਦੇ ਉੱਪਰ ਇੱਕ ਉੱਚੇ ਥੰਮ 'ਤੇ ਖੜ੍ਹਾ ਸੀ।</p>

        <div class="qa-block">

          <p class="ans-txt"><strong>Ans:</strong> The statue was covered with thin leaves of fine gold. It had two bright sapphires for its eyes and a large red ruby glowing on its sword hilt.</p>
          <p class="punjabi-txt">ਬੁੱਤ ਦੇ ਪੂਰੇ ਸਰੀਰ 'ਤੇ ਬਾਰੀਕ ਸੋਨੇ ਦੀਆਂ ਪਤਲੀਆਂ ਪਰਤਾਂ ਚੜ੍ਹਾਈਆਂ ਹੋਈਆਂ ਸਨ। ਇਸ ਦੀਆਂ ਅੱਖਾਂ ਲਈ ਦੋ ਚਮਕਦਾਰ ਨੀਲਮ ਸਨ ਅਤੇ ਇਸ ਦੀ ਤਲਵਾਰ ਦੇ ਮੁੱਠੇ 'ਤੇ ਇੱਕ ਵੱਡਾ ਲਾਲ ਮਾਣਕ ਚਮਕ ਰਿਹਾ ਸੀ।</p>
        </div>

        <div class="qa-block">
          <p><strong>3. Where was the Swallow going?</strong></p>

          <p class="punjabi-txt">ਅਬਾਬੀਲ ਮਿਸਰ ਜਾ ਰਿਹਾ ਸੀ ਤਾਂ ਜੋ ਉਹ ਆਪਣੇ ਦੋਸਤਾਂ ਨਾਲ ਮਿਲ ਸਕੇ ਜੋ ਛੇ ਹਫ਼ਤੇ ਪਹਿਲਾਂ ਉੱਥੇ ਉੱਡ ਗਏ ਸਨ।</p>

        <div class="qa-block">

          <p class="ans-txt"><strong>Ans:</strong> The Swallow put up there because it was a fine position with plenty of fresh air to sleep for the night.</p>
          <p class="punjabi-txt">ਅਬਾਬੀਲ ਉੱਥੇ ਇਸ ਲਈ ਠਹਿਰਿਆ ਕਿਉਂਕਿ ਰਾਤ ਨੂੰ ਸੌਣ ਲਈ ਤਾਜ਼ੀ ਹਵਾ ਵਾਲੀ ਇਹ ਇੱਕ ਵਧੀਆ ਥਾਂ ਸੀ।</p>

          <p class="punjabi-txt">ਪਾਣੀ ਦੀਆਂ ਬੂੰਦਾਂ ਹੈਪੀ ਪ੍ਰਿੰਸ ਦੀਆਂ ਅੱਖਾਂ ਵਿੱਚੋਂ ਆ ਰਹੀਆਂ ਸਨ।</p>
        </div>

        <div class="qa-block">
          <p><strong>6. Why was the Happy Prince crying?</strong></p>
          <p class="punjabi-txt">ਹੈਪੀ ਪ੍ਰਿੰਸ ਕਿਉਂ ਰੋ ਰਿਹਾ ਸੀ?</p>

          <p class="punjabi-txt">ਹੈਪੀ ਪ੍ਰਿੰਸ ਇਸ ਲਈ ਰੋ ਰਿਹਾ ਸੀ ਕਿਉਂਕਿ ਆਪਣੇ ਉੱਚੇ ਸਥਾਨ ਤੋਂ ਉਹ ਆਪਣੇ ਸ਼ਹਿਰ ਦੇ ਗਰੀਬ ਲੋਕਾਂ ਦੀ ਬਦਹਾਲੀ ਅਤੇ ਦੁੱਖਾਂ ਨੂੰ ਦੇਖ ਸਕਦਾ ਸੀ।</p>
        </div>

        <div class="qa-block">
          <p><strong>7. Describe the seamstress in the words of the prince.</strong></p>
          <p class="punjabi-txt">ਰਾਜਕੁਮਾਰ ਦੇ ਸ਼ਬਦਾਂ ਵਿੱਚ ਦਰਜ਼ਨ (ਕੱਪੜੇ ਸਿਊਣ ਵਾਲੀ) ਦਾ ਵਰਣਨ ਕਰੋ।</p>
          <p class="ans-txt"><strong>Ans:</strong> The seamstress had a thin, worn face and coarse, red hands pricked all over by the needle. She was embroidering flowers on a satin gown for the Queen’s maid of honour.</p>
          <p class="punjabi-txt">ਦਰਜ਼ਨ ਦਾ ਚਿਹਰਾ ਪਤਲਾ ਤੇ ਥੱਕਿਆ ਹੋਇਆ ਸੀ ਅਤੇ ਉਸਦੇ ਲਾਲ, ਖੁਰਦਰੇ ਹੱਥਾਂ 'ਤੇ ਸੂਈਆਂ ਚੁੱਭੀਆਂ ਹੋਈਆਂ ਸਨ। ਉਹ ਰਾਣੀ ਦੀ ਖਾਸ ਦਾਸੀ ਲਈ ਰੇਸ਼ਮੀ ਗਾਊਨ 'ਤੇ ਫੁੱਲਾਂ ਦੀ ਕਢਾਈ ਕਰ ਰਹੀ ਸੀ।</p>
        </div>

        <div class="qa-block">

          <p class="punjabi-txt">ਦਰਜ਼ਨ ਦਾ ਛੋਟਾ ਮੁੰਡਾ ਕਿਉਂ ਰੋ ਰਿਹਾ ਸੀ?</p>
          <p class="ans-txt"><strong>Ans:</strong> The little boy was ill. He had fever. He was crying for oranges.</p>
          <p class="punjabi-txt">ਛੋਟਾ ਮੁੰਡਾ ਬੀਮਾਰ ਸੀ। ਉਸ ਨੂੰ ਤੇਜ ਬੁਖਾਰ ਸੀ। ਉਹ ਸੰਤਰਿਆਂ ਲਈ ਰੋ ਰਿਹਾ ਸੀ।</p>

          <p class="punjabi-txt">ਹੈਪੀ ਪ੍ਰਿੰਸ ਨੇ ਅਬਾਬੀਲ ਰਾਹੀਂ ਆਪਣੀ ਤਲਵਾਰ ਦਾ ਲਾਲ ਮਾਣਕ ਦਰਜ਼ਨ ਨੂੰ ਭੇਜਿਆ।</p>

        </div>

          <p class="punjabi-txt">ਅਟਾਰੀ ਵਿੱਚ ਬੈਠਾ ਨੌਜਵਾਨ ਇੱਕ ਨਾਟਕਕਾਰ ਸੀ। ਉਸਨੂੰ ਬਹੁਤ ਠੰਡ ਲੱਗ ਰਹੀ ਸੀ ਅਤੇ ਅੰਗੀਠੀ ਵਿੱਚ ਅੱਗ ਨਹੀਂ ਸੀ, ਉਸ ਨੂੰ ਭੁੱਖ ਵੀ ਲੱਗ ਰਹੀ ਸੀ।</p>

    function goToPage(pageId) {
      document.getElementById('pageClass').style.display = 'none';
      document.getElementById('pageSubject').style.display = 'none';
      document.getElementById('pageLesson').style.display = 'none';
      document.getElementById('pageViewNotes').style.display = 'none';

      document.getElementById(pageId).style.display = 'block';
      window.scrollTo(0, 0);
    }

    function openSubjects(cls) {
      currentClass = cls;
      const subjectContainer = document.getElementById("subjectContainer");
      subjectContainer.innerHTML = "";

      const classNames = { class6: "Class 6", class7: "Class 7", class8: "Class 8", class9: "Class 9", class10: "Class 10" };
      document.getElementById("subjectTitle").innerText = `📖 ${classNames[cls]} - Select Book`;

      if (data[cls]) {
        for (let subject in data[cls]) {
          subjectContainer.innerHTML += `<button class="card-btn subject-btn" onclick="openLessons('${subject}')">${subject}</button>`;
        }
        goToPage('pageSubject');
      }
    }

    function openLessons(subject) {
      const lessonLinks = document.getElementById("lessonLinks");
      lessonLinks.innerHTML = "";
      document.getElementById("lessonTitle").innerText = `📝 ${subject} - Notes`;

      if (currentClass && data[currentClass][subject]) {
        const lessons = data[currentClass][subject];
        if (lessons.length > 0) {
          lessons.forEach(lesson => {
            if(lesson.isInline) {
              lessonLinks.innerHTML += `<div class="lesson-card" onclick="showInlineNotes('${lesson.id}')"><a>📖 ${lesson.title}</a></div>`;
            } else {
              lessonLinks.innerHTML += `<div class="lesson-card"><a href="${lesson.url}" target="_blank">📄 ${lesson.title}</a></div>`;
            }
          });
        } else {
          lessonLinks.innerHTML = "<p style='color:#64748b; text-align:center;'>ਇਸ ਕਿਤਾਬ ਦੇ ਨੋਟਸ ਜਲਦੀ ਹੀ ਅਪਲੋਡ ਕੀਤੇ ਜਾਣਗੇ।</p>";
        }
        goToPage('pageLesson');
      }
    }

    function showInlineNotes(noteId) {
      if (inlineNotes[noteId]) {
        document.getElementById("notesContent").innerHTML = inlineNotes[noteId];
        goToPage('pageViewNotes');
