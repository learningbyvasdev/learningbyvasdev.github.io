<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learning by Vasdev - Study Material</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f7fb; color: #102a43; }
    header { background: linear-gradient(135deg, #173b6f, #602d8d); color: #fff; text-align: center; padding: 40px 15px; }
    header h1 { margin: 0; font-size: 36px; }
    .tag { opacity: 0.9; margin-top: 5px; }
    nav { background: #111827; padding: 14px; text-align: center; }
    nav a { color: #fff; text-decoration: none; margin: 0 12px; font-weight: bold; }
    main { max-width: 900px; margin: auto; padding: 20px 15px; }
    .box { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    
    /* Box Buttons Grid Style */
    .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 15px; }
    .card-btn { background: #f0f4f8; border: 2px solid #cbd5e1; padding: 16px; border-radius: 10px; font-weight: bold; font-size: 16px; color: #173b6f; cursor: pointer; text-align: center; transition: 0.2s; }
    .card-btn:hover, .card-btn.active { background: #173b6f; color: #fff; border-color: #173b6f; }
    
    footer { background: #111827; color: #fff; text-align: center; padding: 20px; margin-top: 40px; }
    a { color: #0056b3; text-decoration: none; }
  </style>
</head>
<body>

  <header>
    <h1>Learning by Vasdev</h1>
    <div class="tag">Learn • Think • Grow</div>
  </header>

  <nav>
    <a href="#home">Home</a>
    <a href="#materials">Study Material</a>
  </nav>

  <main>
    <section id="home" class="box">
      <h2>📚 Welcome</h2>
      <p>Select your class below to access English study materials.</p>
    </section>

    <!-- 1. Classes Grid Section -->
    <section id="materials" class="box">
      <h2>1. Class ਚੁਣੋ (Select Class)</h2>
      <div class="grid-container">
        <button class="card-btn" onclick="selectClass('class6', this)">Class 6</button>
        <button class="card-btn" onclick="selectClass('class7', this)">Class 7</button>
        <button class="card-btn" onclick="selectClass('class8', this)">Class 8</button>
        <button class="card-btn" onclick="selectClass('class9', this)">Class 9</button>
        <button class="card-btn" onclick="selectClass('class10', this)">Class 10</button>
      </div>
    </section>

    <!-- 2. Subject Selection Section -->
    <section id="subjectSection" class="box" style="display:none;">
      <h2>2. Subject ਚੁਣੋ (Select Subject)</h2>
      <div id="subjectContainer" class="grid-container"></div>
    </section>

    <!-- 3. Lessons Links Section -->
    <section id="lessonSection" class="box" style="display:none;">
      <h3>3. Lessons / Notes Links:</h3>
      <div id="lessonLinks"></div>
    </section>
  </main>

  <footer>
    © 2026 Learning by Vasdev • Learn • Think • Grow
  </footer>

  <script>
    let selectedClass = "";

    // ਫਿਲਹਾਲ ਸਿਰਫ਼ English ਜੋੜਿਆ ਗਿਆ ਹੈ
    const data = {
      class6: {
        "English": [
          { title: "Chapter 1 Notes", url: "YOUR_LINK_HERE" }
        ]
      },
      class7: {
        "English": [
          { title: "Chapter 1 Notes", url: "YOUR_LINK_HERE" }
        ]
      },
      class8: {
        "English": [
          { title: "Chapter 1 Notes", url: "YOUR_LINK_HERE" }
        ]
      },
      class9: {
        "English": [
          { title: "Chapter 1 Notes", url: "YOUR_LINK_HERE" }
        ]
      },
      class10: {
        "English": [
          { title: "Chapter 1: The Happy Prince Notes", url: "YOUR_LINK_HERE" },
          { title: "Chapter 2: Where Is Science Taking Us?", url: "YOUR_LINK_HERE" }
        ]
      }
    };

    function selectClass(cls, btn) {
      selectedClass = cls;
      
      // Class buttons active state
      document.querySelectorAll('#materials .card-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const subjectContainer = document.getElementById("subjectContainer");
      subjectContainer.innerHTML = "";
      document.getElementById("lessonSection").style.display = "none";

      if (data[cls]) {
        for (let subject in data[cls]) {
          subjectContainer.innerHTML += `<button class="card-btn" onclick="selectSubject('${subject}', this)">${subject}</button>`;
        }
        document.getElementById("subjectSection").style.display = "block";
      }
    }

    function selectSubject(subject, btn) {
      // Subject buttons active state
      document.querySelectorAll('#subjectContainer .card-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const lessonLinks = document.getElementById("lessonLinks");
      lessonLinks.innerHTML = "";

      if (selectedClass && data[selectedClass][subject]) {
        const lessons = data[selectedClass][subject];
        lessons.forEach(lesson => {
          lessonLinks.innerHTML += `<p style="margin-bottom:12px; font-size:17px;"><a href="${lesson.url}" target="_blank" style="color:#0056b3; font-weight:bold;">📄 ${lesson.title}</a></p>`;
        });
        document.getElementById("lessonSection").style.display = "block";
      }
    }
  </script>

</body>
</html>
