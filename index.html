          <p><strong>Q1. What is the central idea of the poem?</strong><br><span class="ans-txt">Ans: The central idea is that true happiness comes from honesty, self-control, and moral values, not money.</span><span class="punjabi-txt">ਅਸਲੀ ਖੁਸ਼ੀ ਇਮਾਨਦਾਰੀ, ਆਤਮ-ਕੰਟਰੋਲ ਅਤੇ ਨੈਤਿਕਤਾ ਨਾਲ ਮਿਲਦੀ ਹੈ, ਪੈਸੇ ਨਾਲ ਨਹੀਂ।</span></p>
        </div>
      `,
      poem_death_leveller: `
        <h2>Class 10th - Poem 2: Death the Leveller</h2>
        <div class="qa-block">
          <h4>Short Answer Questions</h4>
          <p><strong>Q1. Why are the glories of blood and state called shadows?</strong><br><span class="ans-txt">Ans: Because power, high birth, and fame are short-lived and vanish at death.</span><span class="punjabi-txt">ਕਿਉਂਕਿ ਤਾਕਤ, ਰੁਤਬਾ ਅਤੇ ਸ਼ੋਹਰਤ ਅਸਥਾਈ ਹਨ ਅਤੇ ਮੌਤ ਸਮੇਂ ਖਤਮ ਹੋ ਜਾਂਦੀਆਂ ਹਨ।</span></p>

      `,
      poem_pertab_singh: `
        <h2>Class 10th - Poem 3: A Ballad of Sir Pertab Singh</h2>
        <div class="qa-block">
          <h4>Short Answer Questions</h4>
          <p><strong>Q1. Why did the English soldier leave a strong impression on Pertab Singh?</strong><br><span class="ans-txt">Ans: Because the English soldier was brave, honorable, and shared soldierly values with Pertab Singh.</span><span class="punjabi-txt">ਕਿਉਂਕਿ ਅੰਗਰੇਜ਼ ਸਿਪਾਹੀ ਬਹਾਦਰ, ਇਮਾਨਦਾਰ ਸੀ ਅਤੇ ਫੌਜੀ ਗੁਣ ਸਾਂਝੇ ਕਰਦਾ ਸੀ।</span></p>

      `,
      bed_number_29: `<h2>Class 10th - Supplementary - Bed Number-29</h2>`,
      half_rupee_worth: `<h2>Class 10th - Supplementary - Half a Rupee Worth</h2>`,

      dying_detective: `<h2>Class 10th - Supplementary - The Dying Detective</h2>`,
      how_much_land: `<h2>Class 10th - Supplementary - How Much Land Does A Man Need?</h2>`,
      return_to_air: `<h2>Class 10th - Supplementary - Return to Air</h2>`
    };

    function goToPage(pageId, resetHash = false) {
      document.getElementById('pageClass').style.display = 'none';
      document.getElementById('pageSubject').style.display = 'none';
      document.getElementById('pageLesson').style.display = 'none';
      document.getElementById('pageViewNotes').style.display = 'none';

      document.getElementById(pageId).style.display = 'block';
      window.scrollTo(0, 0);

      if (resetHash) {
        history.pushState("", document.title, window.location.pathname + window.location.search);
      }
    }

    function openSubjects(cls, pushState = true) {
      currentClass = cls;
      const subjectContainer = document.getElementById("subjectContainer");
      subjectContainer.innerHTML = "";

      const classNames = { class6: "Class 6", class7: "Class 7", class8: "Class 8", class9: "Class 9", class10: "Class 10" };
      document.getElementById("subjectTitle").innerText = `📖 ${classNames[cls]} - Select Book`;

      if (data[cls]) {
        for (let subject in data[cls]) {
          let btnClass = subject.includes("Internal") ? "card-btn internal-btn" : "card-btn subject-btn";
          subjectContainer.innerHTML += `<button class="${btnClass}" onclick="openLessons('${subject}')">${subject}</button>`;
        }
        goToPage('pageSubject');
        if(pushState) {
          history.pushState({page: 'subject', cls: cls}, "", `#${cls}`);
        }
      }
    }

    function openLessons(subject, pushState = true) {
      currentSubject = subject;
      const lessonLinks = document.getElementById("lessonLinks");
      lessonLinks.innerHTML = "";
      document.getElementById("lessonTitle").innerText = `📝 ${subject} - Notes`;

      if (currentClass && data[currentClass][subject]) {
        const lessons = data[currentClass][subject];
        if (lessons.length > 0) {
          lessons.forEach(lesson => {
            if(lesson.isInline) {
              lessonLinks.innerHTML += `<div class="lesson-card" onclick="showInlineNotes('${lesson.id}')"><a>📖 ${lesson.title}</a></div>`;
            } else {
              lessonLinks.innerHTML += `<div class="lesson-card"><a href="${lesson.url}" target="_blank">📄 ${lesson.title}</a></div>`;
            }
          });
        } else {
          lessonLinks.innerHTML = "<p style='color:#64748b; text-align:center;'>ਇਸ ਕਿਤਾਬ ਦੇ ਨੋਟਸ ਜਲਦੀ ਹੀ ਅਪਲੋਡ ਕੀਤੇ ਜਾਣਗੇ।</p>";
        }
        goToPage('pageLesson');
        if(pushState) {
          let subKey = subject.includes("Main") ? "main" : (subject.includes("Internal") ? "internal" : "supp");
          history.pushState({page: 'lesson', cls: currentClass, sub: subKey}, "", `#${currentClass}_${subKey}`);
        }
      }
    }

    function showInlineNotes(noteId, pushState = true) {
      if (inlineNotes[noteId]) {
        document.getElementById("notesContent").innerHTML = inlineNotes[noteId];
        goToPage('pageViewNotes');
        if(pushState) {
          history.pushState({page: 'view', id: noteId}, "", `#note_${noteId}`);
        }
      }
    }

    function goBackToSubject() {
      openSubjects(currentClass);
    }

    function goBackToLesson() {
      openLessons(currentSubject);
    }

    window.addEventListener('popstate', function(event) {
      handleRouting();
    });

    function handleRouting() {
      let hash = window.location.hash.replace('#', '');
      if (!hash) {
        goToPage('pageClass');
        return;
      }

      if (hash.startsWith('note_')) {
        let noteId = hash.replace('note_', '');
        for (let cls in data) {
          for (let sub in data[cls]) {
            let found = data[cls][sub].find(l => l.id === noteId);
            if (found) {
              currentClass = cls;
              currentSubject = sub;
              showInlineNotes(noteId, false);
              return;
            }
          }
        }
      } else if (hash.includes('_')) {
        let parts = hash.split('_');
        let cls = parts[0];
        let subKey = parts[1];
        let subName = subKey === 'main' ? "Main Course Book 📘" : (subKey === 'internal' ? "Important Internal Questions & Answers 🌟" : "Supplementary Reader 📙");
        currentClass = cls;
        openLessons(subName, false);
      } else {
        openSubjects(hash, false);
      }
    }

    window.onload = function() {
      if (window.location.hash) {
        handleRouting();
      }
    };
  </script>

</body>
</html>
